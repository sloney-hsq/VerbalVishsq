<!doctype html><html lang="en"><meta charset="utf-8"><title>Visual analysis check</title><style>*{box-sizing:border-box}body{font:14px system-ui;background:#f4f6fa;color:#172133;padding:24px;margin:0}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1440px;margin:auto}section{background:white;padding:12px;border:1px solid #d9e1ec;border-radius:12px;overflow:hidden}section>img{width:100%;height:auto}.wide-card{grid-column:1/-1}.heatmap-card nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}.heatmap-card button{padding:5px 9px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc}.heatmap-frame{max-height:620px;overflow:auto}.heatmap-frame img{display:block;width:100%;height:auto;min-width:900px}h1{max-width:1440px;margin:0 auto 18px}h2{font-size:16px}@media(max-width:879px){main{grid-template-columns:1fr}.wide-card{grid-column:span 1}body{padding:12px}}</style><h1>Olist visual analysis — six chart families</h1><main><section class=""><h2>bar — delivery_rank</h2><img src="bar.svg" alt="bar rendered from actual Olist data"></section>
<section class=""><h2>histogram — freight_histogram</h2><img src="histogram.svg" alt="histogram rendered from actual Olist data"></section>
<section class="wide-card"><h2>line — delivery_monthly</h2><img src="line.svg" alt="line rendered from actual Olist data"></section>
<section class=""><h2>scatter — freight_scatter</h2><img src="scatter.svg" alt="scatter rendered from actual Olist data"></section>
<section class=""><h2>boxplot — delivery_box</h2><img src="boxplot.svg" alt="boxplot rendered from actual Olist data"></section>
<section class="wide-card heatmap-card"><h2>heatmap — delivery_heatmap</h2><nav aria-label="Heatmap pages"><button data-step="-1">Previous</button><span id="page-label">Page 1 of 4</span><button data-step="1">Next</button><button id="view-all">View all</button><span id="range-label">1–20 of 73 categories</span></nav><div class="heatmap-frame"><img id="heatmap-image" src="heatmap.svg" alt="heatmap rendered from actual Olist data"></div></section></main><script>let page=1,all=false;const total=4,count=73,size=20,img=document.querySelector('#heatmap-image'),label=document.querySelector('#page-label'),range=document.querySelector('#range-label');function draw(){img.src=all?'heatmap-full.svg':page===1?'heatmap.svg':'heatmap-page-'+page+'.svg';label.textContent=all?'All categories':'Page '+page+' of '+total;range.textContent=all?'All '+count+' categories':((page-1)*size+1)+'–'+Math.min(count,page*size)+' of '+count+' categories';document.querySelector('#view-all').textContent=all?'Paged view':'View all'}document.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{all=false;page=Math.max(1,Math.min(total,page+Number(button.dataset.step)));draw()});document.querySelector('#view-all').onclick=()=>{all=!all;draw()}</script>
